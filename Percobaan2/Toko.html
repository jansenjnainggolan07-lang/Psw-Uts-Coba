<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TokoKu</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#produk">Produk</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>

    <main id="home">
        <h2>Daftar Produk</h2>

        <section class="produk" id="produk">

            <article class="item">
                <img src="https://placehold.co/400x250?text=Sepatu"
                     alt="Sepatu">
                <h3>Sepatu Sneakers</h3>
                <p class="harga">Rp250.000</p>
            </article>

            <article class="item">
                <img src="https://placehold.co/400x250?text=Tas"
                     alt="Tas">
                <h3>Tas Ransel</h3>
                <p class="harga">Rp150.000</p>
            </article>

            <article class="item">
                <img src="https://placehold.co/400x250?text=Jam"
                     alt="Jam Tangan">
                <h3>Jam Tangan</h3>
                <p class="harga">Rp200.000</p>
            </article>

        </section>
    </main>

    <footer id="kontak">
        <p>&copy; 2026 TokoKu. Hak Cipta Dilindungi.</p>
    </footer>

</body>
</html>
