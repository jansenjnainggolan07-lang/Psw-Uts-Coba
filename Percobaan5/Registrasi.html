<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrasi Mahasiswa</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS sendiri -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="form-container">

            <h2>Registrasi Mahasiswa</h2>

            <form id="formRegistrasi" novalidate>

                <div class="mb-3">
                    <label for="nama" class="form-label">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nama"
                        placeholder="Masukkan nama lengkap">

                    <div id="errorNama"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="email"
                        placeholder="nama@email.com">

                    <div id="errorEmail"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Minimal 6 karakter">

                    <div id="errorPassword"></div>
                </div>

                <div class="mb-3">
                    <label for="konfirmasi" class="form-label">
                        Konfirmasi Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="konfirmasi"
                        placeholder="Masukkan ulang password">

                    <div id="errorKonfirmasi"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Daftar Sekarang
                </button>

            </form>
        </div>
    </div>

    <!-- Modal sukses -->
    <div class="modal fade" id="modalSukses" tabindex="-1"
         aria-labelledby="judulModal" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="judulModal">
                        Pendaftaran Berhasil
                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"
                            aria-label="Tutup">
                    </button>
                </div>

                <div class="modal-body">
                    Pendaftaran berhasil! Selamat datang di
                    E-Learning IT Del.
                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-success"
                            data-bs-dismiss="modal">
                        Tutup
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript sendiri -->
    <script src="script.js"></script>

</body>
</html>
