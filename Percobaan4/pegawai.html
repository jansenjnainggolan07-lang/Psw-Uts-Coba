<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Data Pegawai</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Sistem Data Pegawai</h1>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Pegawai</th>
                        <th>Jabatan</th>
                        <th>Gaji Pokok</th>
                        <th>Pajak</th>
                        <th>Tunjangan</th>
                        <th>Gaji Bersih</th>
                    </tr>
                </thead>

                <tbody id="dataPegawai">
                </tbody>
            </table>
        </div>

        <div class="hasil">
            <h2>Gaji Bersih Tertinggi</h2>
            <p id="pegawaiTertinggi"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
